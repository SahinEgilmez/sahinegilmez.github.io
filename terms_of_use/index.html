<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Şahin Eğilmez tarafından geliştirilen uygulamaların kullanım koşulları." />
    <title>Kullanım Koşulları | Şahin Eğilmez</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #17201c;
            --muted: #66716b;
            --paper: #f7f5ef;
            --accent: #176b4d;
            --accent-soft: #e3f0e9;
            --line: #d9ddd9;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            color: var(--ink);
            background: linear-gradient(rgba(23, 107, 77, 0.04) 1px, transparent 1px), var(--paper);
            background-size: 100% 32px;
            font-family: Georgia, 'Times New Roman', serif;
        }

        header,
        main,
        footer {
            width: min(760px, calc(100% - 40px));
            margin-inline: auto;
        }

        header {
            padding: 72px 0 32px;
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 7vw, 3.5rem);
            line-height: 1.05;
            letter-spacing: 0;
        }

        .intro {
            max-width: 600px;
            margin: 18px 0 0;
            color: var(--muted);
            font-family: 'Trebuchet MS', sans-serif;
            line-height: 1.7;
        }

        .terms-list {
            border-block: 1px solid var(--line);
        }

        .terms-link {
            display: grid;
            grid-template-columns: 52px 1fr auto;
            gap: 18px;
            align-items: center;
            padding: 24px 4px;
            color: inherit;
            text-decoration: none;
        }

        .terms-link:hover .terms-title,
        .terms-link:focus-visible .terms-title {
            color: var(--accent);
        }

        .app-mark {
            display: grid;
            width: 52px;
            height: 52px;
            place-items: center;
            border: 1px solid #bad1c6;
            border-radius: 8px;
            color: var(--accent);
            background: var(--accent-soft);
            font-weight: 700;
        }

        .terms-title {
            display: block;
            font-size: 1.25rem;
            font-weight: 700;
            transition: color 160ms ease;
        }

        .terms-meta {
            display: block;
            margin-top: 5px;
            color: var(--muted);
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 0.85rem;
        }

        .arrow {
            color: var(--accent);
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 1.4rem;
        }

        footer {
            padding: 28px 0 56px;
            color: var(--muted);
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 0.82rem;
        }

        footer a {
            color: var(--accent);
        }

        @media (max-width: 520px) {
            header {
                padding-top: 48px;
            }

            .terms-link {
                grid-template-columns: 44px 1fr auto;
                gap: 14px;
            }

            .app-mark {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>

<body>
    <header>
        <p class="eyebrow">Şahin Eğilmez</p>
        <h1>Kullanım Koşulları</h1>
        <p class="intro">Uygulamalarıma ait güncel kullanım koşullarına aşağıdan ulaşabilirsiniz.</p>
    </header>
    <main>
        <nav class="terms-list" aria-label="Uygulama kullanım koşulları">
            <a class="terms-link" href="siirhane/">
                <span class="app-mark" aria-hidden="true">Ş</span>
                <span>
                    <span class="terms-title">Şiirhane</span>
                    <span class="terms-meta">Kullanım koşulları ve abonelik şartları</span>
                </span>
                <span class="arrow" aria-hidden="true">→</span>
            </a>
        </nav>
    </main>
    <footer><a href="/">sahinegilmez.github.io</a></footer>
</body>

</html>
